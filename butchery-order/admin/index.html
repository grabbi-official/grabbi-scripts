<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Grabbi Butchery — Orders</title>
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="../assets/grabbi-logo-green.webp">
<link rel="stylesheet" href="../assets/fonts.css">
<style>
:root{--g:#1A5C35;--g2:#144a2a;--lime:#B5E550;--cream:#FAF7F0;--dark:#111B14;--ink:#111B14;--mut:#5d6a61;--line:rgba(17,27,20,.1);--line2:rgba(17,27,20,.18);--paper:#fff;
  --new:#B5E550;--confirmed:#3d7be0;--ready:#d98a12;--completed:#1A5C35;--cancelled:#9aa29c;--red:#B4372B;
  --spring:cubic-bezier(.2,.9,.25,1);--ease:cubic-bezier(.3,.7,.4,1)}
*{box-sizing:border-box;margin:0;padding:0}*::before,*::after{box-sizing:border-box}
body{font:400 15px/1.45 Barlow,system-ui,sans-serif;color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
a{color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.hide{display:none!important}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:8px}

/* Login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 500px at 80% 0,rgba(181,229,80,.25),transparent 60%),var(--cream)}
.lbox{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 30px;box-shadow:0 40px 80px -40px rgba(17,27,20,.4)}
.lbox img{height:44px;margin-bottom:22px}
.lbox h1{font:800 34px/1 "Barlow Condensed";text-transform:uppercase}
.lbox p{color:var(--mut);margin:6px 0 22px}
.inp{width:100%;height:52px;padding:0 16px;border:1px solid var(--line2);border-radius:14px;background:#fff;font-size:16px;outline:0;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(26,92,53,.12)}
.chk{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:14px;color:var(--mut)}
.chk input{width:18px;height:18px;accent-color:var(--g)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;transition:transform .1s var(--ease),background .2s,opacity .2s;text-decoration:none;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--g);color:#fff}.btn.pri:hover:not(:disabled){background:var(--g2)}
.btn.lime{background:var(--lime);color:var(--dark)}
.btn.dark{background:var(--dark);color:#fff}
.btn.out{background:#fff;border:1px solid var(--line2)}
.btn.soft{background:#f1ede3}
.btn.red{background:#fbeceb;color:var(--red)}
.btn.w{width:100%}
.btn svg{width:17px;height:17px}
.err{color:var(--red);font-weight:600;font-size:14px;margin-top:10px;min-height:20px}

/* Top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(250,247,240,.78);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 20px;max-width:1680px;margin:0 auto}
.top img{height:30px}
.top h1{font:800 22px/1 "Barlow Condensed";text-transform:uppercase;letter-spacing:.01em;padding-left:12px;border-left:1px solid var(--line2)}
.top .sp{flex:1}
.live{display:flex;align-items:center;gap:8px;font:500 12.5px "JetBrains Mono";color:var(--mut)}
.live i{width:8px;height:8px;border-radius:50%;background:#2E8A4F;box-shadow:0 0 0 0 rgba(46,138,79,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(46,138,79,0)}100%{box-shadow:0 0 0 0 rgba(46,138,79,0)}}
.ib{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;transition:transform .1s,background .2s}
.ib:active{transform:scale(.94)}.ib svg{width:18px;height:18px}.ib.on{background:var(--lime)}

main{max-width:1680px;margin:0 auto;padding:16px 20px 40px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;transition:transform .1s,border-color .2s}
button.kpi:active{transform:scale(.98)}
.kpi small{font:600 11.5px "JetBrains Mono";letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.kpi b{display:block;font:800 34px/1.05 "Barlow Condensed";margin-top:4px}
.kpi span{font-size:13px;color:var(--mut)}
.kpi.hot{background:var(--dark);color:#fff;border-color:transparent}.kpi.hot b{color:var(--lime)}.kpi.hot small,.kpi.hot span{color:rgba(255,255,255,.6)}

/* Workspace */
.ws{display:grid;grid-template-columns:400px minmax(0,1fr) 300px;gap:16px;align-items:start}
.col{min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.tabs button i{font:600 11px "JetBrains Mono";font-style:normal;background:#f1ede3;border-radius:999px;padding:2px 7px}
.tabs button.on{background:var(--dark);color:#fff;border-color:var(--dark)}.tabs button.on i{background:var(--lime);color:var(--dark)}
.filters{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:10px}
.filters input,.filters select{height:42px;border:1px solid var(--line2);border-radius:12px;background:#fff;padding:0 12px;font-size:14.5px;outline:0;min-width:0}
.filters input:focus{border-color:var(--g)}
.olist{display:flex;flex-direction:column;gap:8px;max-height:calc(100dvh - 300px);overflow:auto;padding:2px;overscroll-behavior:contain}
.oc{position:relative;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 18px;transition:border-color .2s,box-shadow .2s,transform .1s}
.oc:active{transform:scale(.99)}
.oc::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--sc)}
.oc.on{border-color:var(--g);box-shadow:0 0 0 3px rgba(26,92,53,.14)}
.oc.fresh::after{content:"NEW";position:absolute;right:12px;top:-8px;font:700 10px "JetBrains Mono";background:var(--lime);color:var(--dark);padding:3px 6px;border-radius:6px}
.oc .r1{display:flex;align-items:baseline;gap:8px}
.oc .biz{font-weight:700;font-size:15.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc .amt{font:700 15px "JetBrains Mono"}
.oc .r2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:12.5px;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font:600 11.5px Barlow;background:#f1ede3;color:#3b463f;white-space:nowrap}
.pill.s{background:color-mix(in srgb,var(--sc) 18%,#fff);color:color-mix(in srgb,var(--sc) 70%,#000)}
.pill.pay-ok{background:#e4f3d0;color:var(--g)}.pill.pay-hold{background:#e7efff;color:#2652a3}.pill.pay-due{background:#fff2dc;color:#8a560b}.pill.pay-bad{background:#fbeceb;color:var(--red)}
.empty{padding:40px 16px;text-align:center;color:var(--mut);background:#fff;border:1px dashed var(--line2);border-radius:14px}

/* Detail */
.detail{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 30px 60px -40px rgba(17,27,20,.4)}
.d-h{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}
.d-h .t{flex:1;min-width:0}
.d-h h2{font:800 30px/1 "Barlow Condensed";text-transform:uppercase;letter-spacing:.005em}
.d-h .sub{color:var(--mut);margin-top:6px;font-size:14px}
.d-h .ref{font:700 13px "JetBrains Mono";background:var(--dark);color:var(--lime);padding:6px 10px;border-radius:8px;white-space:nowrap}
.d-b{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.d-main{padding:18px 22px;border-right:1px solid var(--line)}
.d-side{padding:18px 22px;background:#fcfbf7}
.lbl{font:700 12px "Barlow Condensed";letter-spacing:.16em;text-transform:uppercase;color:var(--g);margin:0 0 10px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
.steps button{height:40px;border-radius:10px;background:#f1ede3;font-weight:700;font-size:13.5px;color:#55605a;position:relative;transition:background .2s,color .2s,transform .1s}
.steps button:active{transform:scale(.97)}
.steps button.done{background:color-mix(in srgb,var(--sc) 22%,#fff);color:color-mix(in srgb,var(--sc) 70%,#000)}
.steps button.cur{background:var(--sc);color:#fff}
.steps button.cur[data-s=new]{color:var(--dark)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font:600 11.5px "JetBrains Mono";letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:0 6px 8px;border-bottom:1px solid var(--line2)}
td{padding:10px 6px;border-bottom:1px dashed var(--line2);vertical-align:middle}
.r{text-align:right}
td b{font-weight:600}
td .q{font-family:"JetBrains Mono"}
.aw{width:92px;height:36px;border:1px solid var(--line2);border-radius:9px;text-align:right;padding:0 8px;font:700 14px "JetBrains Mono";outline:0;background:#fff}
.aw:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(26,92,53,.14)}
.aw.chg{border-color:var(--confirmed);background:#f3f7ff}
tfoot td{border:0;padding-top:12px;font-weight:700}
tfoot .big{font:800 26px "Barlow Condensed"}
.wnote{font-size:12.5px;color:var(--mut);margin-top:8px}
.notes{margin-top:16px;padding:12px 14px;border-radius:12px;background:#fff8e6;border:1px solid #f3e2b5;font-size:14.5px}
.notes b{display:block;font:700 12px "Barlow Condensed";letter-spacing:.14em;text-transform:uppercase;color:#8a560b;margin-bottom:4px}
dl{display:grid;gap:12px}
dt{font:600 11.5px "JetBrains Mono";letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
dd{font-size:15px;font-weight:500;margin-top:2px;word-break:break-word}
dd a{color:var(--g);font-weight:600}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 18px}
.paybox{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;margin-bottom:16px}
.paybox .row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:#3b463f}
.paybox .row b{font-family:"JetBrains Mono"}
.paybox .acts{display:grid;gap:8px;margin-top:12px}
.paybox .hint{font-size:12.5px;color:var(--mut);margin-top:8px}
.d-f{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line);background:#fcfbf7}
.d-f .sp{flex:1}
.blank{display:grid;place-items:center;min-height:420px;color:var(--mut);text-align:center;padding:30px}
.blank svg{width:56px;height:56px;color:#cfd4cd;margin:0 auto 10px}

/* Prep */
.prep{background:var(--dark);color:#fff;border-radius:20px;padding:18px 18px 10px;position:sticky;top:76px}
.prep h3{font:800 24px/1 "Barlow Condensed";text-transform:uppercase}
.prep p{font-size:13px;color:rgba(255,255,255,.6);margin:4px 0 12px}
.prep .li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.15);font-size:14.5px}
.prep .li b{font:700 14px "JetBrains Mono";color:var(--lime);white-space:nowrap}
.prep .acts{display:grid;gap:8px;margin:14px 0 8px}
.prep .btn{background:rgba(255,255,255,.08);color:#fff}
.prep .seg{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;margin-bottom:6px}
.prep .seg button{flex:1;height:30px;border-radius:8px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.7)}
.prep .seg button.on{background:var(--lime);color:var(--dark)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,calc(100% + 40px));visibility:hidden;background:var(--dark);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:90;transition:transform .4s var(--spring),visibility .4s;max-width:90vw;box-shadow:0 20px 40px -12px rgba(0,0,0,.4)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.modal{position:fixed;inset:0;z-index:80;background:rgba(17,27,20,.45);display:grid;place-items:center;padding:20px}
.mbox{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:380px;display:grid;gap:10px}
.mbox h3{font:800 26px/1 "Barlow Condensed";text-transform:uppercase;margin-bottom:6px}

@media(max-width:1560px){.ws{grid-template-columns:360px minmax(0,1fr)}.prepcol{grid-column:1/-1}.prep{position:static}.prep .list{columns:3;column-gap:24px}}
@media(max-width:1100px){.d-b{grid-template-columns:1fr}.d-main{border-right:0;border-bottom:1px solid var(--line)}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){
  .ws{grid-template-columns:1fr}.olist{max-height:none}
  .detailcol{position:fixed;inset:0;z-index:50;background:var(--cream);overflow:auto;transform:translateX(100%);transition:transform .4s var(--spring);padding:0 0 30px}
  .detailcol.on{transform:none}
  .detail{border-radius:0;border:0}
  .back{display:flex!important}
  .kpis{grid-template-columns:repeat(2,1fr)}.kpis .kpi:last-child{display:none}
  .top h1{display:none}.prep .list{columns:1}
}
.back{display:none;align-items:center;gap:6px;padding:12px 16px;font-weight:700;position:sticky;top:0;background:rgba(250,247,240,.9);backdrop-filter:blur(14px);z-index:2;border-bottom:1px solid var(--line);width:100%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.12s!important}}
</style>
</head>
<body>

<section class="login" id="login">
  <form class="lbox" id="lf">
    <img src="../assets/grabbi-logo-green.webp" alt="Grabbi" width="98" height="44">
    <h1>Butchery orders</h1>
    <p>Staff only. Enter the dashboard passcode.</p>
    <input type="text" name="username" value="butchery-admin" autocomplete="username" hidden>
    <input class="inp" type="password" id="pass" placeholder="Passcode" autocomplete="current-password" autofocus>
    <label class="chk"><input type="checkbox" id="remember"> Remember on this device</label>
    <button class="btn pri w" id="lbtn">Open dashboard →</button>
    <div class="err" id="lerr"></div>
  </form>
</section>

<div id="app" class="hide">
<header class="top"><div class="top-in">
  <img src="../assets/grabbi-logo-green.webp" alt="Grabbi" width="67" height="30"><h1>Butchery orders</h1>
  <span class="sp"></span>
  <span class="live"><i></i><span id="upd">—</span></span>
  <button class="ib" title="Refresh" onclick="load(true)" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  <button class="ib" title="Desktop alerts" id="bell" onclick="toggleAlerts()" aria-label="Alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
  <button class="ib" title="Change passcode" onclick="openPass()" aria-label="Change passcode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></svg></button>
  <button class="ib" title="Lock" onclick="logout()" aria-label="Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
</div></header>

<main>
  <section class="kpis" id="kpis"></section>
  <div class="ws">
    <section class="col">
      <div class="tabs" id="tabs"></div>
      <div class="filters">
        <input id="q" type="search" name="order-search" autocomplete="off" data-lpignore="true" data-1p-ignore placeholder="Search business, phone, ref, cut…" aria-label="Search orders">
        <select id="fStore" aria-label="Store"><option value="">All</option><option value="Aberkenfig">Aberkenfig</option><option value="Porthcawl">Porthcawl</option><option value="delivery">Delivery</option></select>
        <select id="fDays" aria-label="Period"><option value="7">7d</option><option value="30">30d</option><option value="60" selected>60d</option><option value="365">1y</option></select>
      </div>
      <div class="olist" id="list"></div>
    </section>
    <section class="col detailcol" id="dcol"><button class="back" onclick="closeDetail()">‹ Orders</button><div id="detail"></div></section>
    <aside class="col prepcol">
      <div class="prep">
        <h3>Butcher's prep list</h3>
        <p>Total to cut for open orders</p>
        <div class="seg" id="prepWhen"><button data-w="all" class="on">All open</button><button data-w="today">Today</button><button data-w="tomorrow">Tomorrow</button></div>
        <div class="list" id="prep"></div>
        <div class="acts">
          <button class="btn" onclick="printPrep()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print prep list</button>
          <button class="btn" onclick="printSlips(filtered())">Print all slips in view</button>
          <button class="btn" onclick="csv()">Export CSV</button>
        </div>
      </div>
    </aside>
  </div>
</main>
</div>

<div class="modal hide" id="pm"><div class="mbox">
  <h3>Change passcode</h3>
  <input class="inp" type="password" id="np1" placeholder="New passcode (min 8)" autocomplete="new-password">
  <input class="inp" type="password" id="np2" placeholder="Repeat new passcode" autocomplete="new-password">
  <div class="err" id="perr"></div>
  <button class="btn pri" onclick="changePass()">Save</button>
  <button class="btn soft" onclick="$('pm').classList.add('hide')">Cancel</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const SB="https://qahpwpwncqiwwivmtdyr.supabase.co",KEY="sb_publishable_34SwXJPoxQGgdDkbu9Qx_Q_52UGazxI";
const FLOW=["new","confirmed","ready","completed"];
const SC={new:"var(--new)",confirmed:"var(--confirmed)",ready:"var(--ready)",completed:"var(--completed)",cancelled:"var(--cancelled)"};
const LABEL={new:"New",confirmed:"Confirmed",ready:"Ready",completed:"Completed",cancelled:"Cancelled"};
const $=id=>document.getElementById(id);
const M=n=>"£"+(+n||0).toFixed(2);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fq=(q,u)=>u==="kg"?(+(+q).toFixed(2))+" kg":(+q)+" "+u+(+q>1?"s":"");
const day=d=>d?new Date(d+"T12:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}):"";
const dayKey=off=>{const d=new Date();d.setDate(d.getDate()+off);return d.toLocaleDateString("en-CA")};
let PASS="",ORD=[],tab="new",sel=null,seen=null,alerts=false,timer=null,prepWhen="all",draft={};

const ss={get(k){try{return sessionStorage.getItem(k)||localStorage.getItem(k)}catch{return null}},set(k,v,rem){try{(rem?localStorage:sessionStorage).setItem(k,v)}catch{}},del(k){try{sessionStorage.removeItem(k);localStorage.removeItem(k)}catch{}}};
async function rpc(fn,args){const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});const j=await r.json();if(!r.ok)throw new Error(j.message||"Request failed");if(j&&j.ok===false)throw new Error(j.error);return j}
async function api(action,ref){const r=await fetch("/api/admin-pay",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pass:PASS,ref,action})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Payment action failed");return j}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),3200)}
function ago(d){const s=(Date.now()-new Date(d))/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago"}
const storeName=o=>o.fulfilment==="delivery"?"Delivery":(o.store||"").replace("Grabbi ","").split(" —")[0];
const biz=o=>o.business_name||o.customer_name;

/* ---------- Auth ---------- */
$("lf").addEventListener("submit",async e=>{e.preventDefault();$("lerr").textContent="";$("lbtn").textContent="Checking…";
  try{PASS=$("pass").value.trim();await fetchOrders();ss.set("grb_admin",PASS,$("remember").checked);enter()}catch(x){$("lerr").textContent=x.message}finally{$("lbtn").textContent="Open dashboard →"}});
function enter(){$("q").value="";$("login").classList.add("hide");$("app").classList.remove("hide");render();clearInterval(timer);timer=setInterval(()=>load(false),30000)}
function logout(){ss.del("grb_admin");PASS="";clearInterval(timer);location.reload()}

async function fetchOrders(){
  const j=await rpc("admin_meat_orders",{pass:PASS,since_days:+$("fDays").value});
  const prev=seen;ORD=j.orders||[];
  if(prev){const fresh=ORD.filter(o=>!prev.has(o.order_ref));if(fresh.length)notify(fresh)}
  seen=new Set(ORD.map(o=>o.order_ref));
  $("upd").textContent="Updated "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
}
async function load(manual){try{await fetchOrders();render();if(manual)toast("Refreshed")}catch(x){if(/passcode|attempts/i.test(x.message))logout();else if(manual)toast(x.message)}}
function notify(fresh){
  toast(`${fresh.length} new order${fresh.length>1?"s":""}: ${fresh.map(biz).join(", ")}`);
  try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.18].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.15);o.start(c.currentTime+t);o.stop(c.currentTime+t+.16)})}catch{}
  if(alerts&&"Notification"in window&&Notification.permission==="granted")fresh.forEach(o=>new Notification("New butchery order "+o.order_ref,{body:`${biz(o)} — ${M(o.total)}`}));
  document.title=`(${fresh.length}) New order — Grabbi`;setTimeout(()=>document.title="Grabbi Butchery — Orders",8000);
}
async function toggleAlerts(){if(!("Notification"in window))return toast("Desktop alerts not supported here. Sound alerts are on.");const p=await Notification.requestPermission();alerts=p==="granted";$("bell").classList.toggle("on",alerts);toast(alerts?"Desktop alerts on":"Alerts are blocked in browser settings")}

/* ---------- Helpers ---------- */
function payInfo(o){
  const pm=o.payment_method||"collection",ps=o.payment_status||"unpaid";
  if(pm==="card"){
    if(ps==="captured")return["pay-ok","Card paid "+M(o.amount_captured)];
    if(ps==="authorised")return["pay-hold","Card held "+M(o.amount_authorised)];
    if(ps==="released")return["","Hold released"];
    return["pay-bad","Card not finished"];
  }
  if(ps==="paid_in_store")return["pay-ok","Paid in store"];
  return["pay-due","Pay on "+(o.fulfilment==="delivery"?"delivery":"collection")];
}
const finalItems=o=>o.final_items||o.items||[];
const dueTotal=o=>o.final_total!=null?+o.final_total:+o.total;

function filtered(){
  const q=$("q").value.toLowerCase().trim(),st=$("fStore").value;
  return ORD.filter(o=>{
    if(tab==="open"){if(!["new","confirmed","ready"].includes(o.status))return false}
    else if(tab==="charge"){if(!(o.payment_status==="authorised"))return false}
    else if(tab!=="all"&&o.status!==tab)return false;
    if(st==="delivery"&&o.fulfilment!=="delivery")return false;
    if(st&&st!=="delivery"&&!(o.store||"").includes(st))return false;
    if(q){const h=[o.order_ref,o.business_name,o.customer_name,o.phone,o.email,o.postcode,o.address,...(o.items||[]).map(i=>i.name)].join(" ").toLowerCase();if(!h.includes(q))return false}
    return true}).sort((a,b)=>tab==="completed"||tab==="all"||tab==="cancelled"?new Date(b.created_at)-new Date(a.created_at):(a.preferred_date||"9")<(b.preferred_date||"9")?-1:1);
}

/* ---------- Render ---------- */
function render(){
  const live=ORD.filter(o=>o.status!=="cancelled"),openO=ORD.filter(o=>["new","confirmed","ready"].includes(o.status));
  const today=dayKey(0),tom=dayKey(1),w0=Date.now()-7*864e5;
  const dueT=openO.filter(o=>o.preferred_date===today).length,dueM=openO.filter(o=>o.preferred_date===tom).length;
  const holds=ORD.filter(o=>o.payment_status==="authorised"),week=live.filter(o=>+new Date(o.created_at)>=w0);
  let kg=0;openO.forEach(o=>(o.items||[]).forEach(i=>{if(i.unit==="kg")kg+= +i.qty}));
  $("kpis").innerHTML=`
    <button class="kpi hot" data-tab="new"><small>New — to confirm</small><b>${ORD.filter(o=>o.status==="new").length}</b><span>tap to view</span></button>
    <button class="kpi" data-tab="open"><small>Due today / tomorrow</small><b>${dueT} <span style="font-size:22px;color:var(--mut)">/ ${dueM}</span></b><span>${openO.length} open orders</span></button>
    <div class="kpi"><small>Kg to cut</small><b>${+kg.toFixed(1)}</b><span>open orders</span></div>
    <button class="kpi" data-tab="charge"><small>Card holds to charge</small><b>${holds.length}</b><span>${M(holds.reduce((a,o)=>a+ +o.amount_authorised,0))} held</span></button>
    <div class="kpi"><small>Last 7 days</small><b>£${Math.round(week.reduce((a,o)=>a+dueTotal(o),0))}</b><span>${week.length} orders</span></div>`;
  const cnt=s=>s==="all"?ORD.length:s==="open"?openO.length:s==="charge"?holds.length:ORD.filter(o=>o.status===s).length;
  $("tabs").innerHTML=[["new","New"],["confirmed","Confirmed"],["ready","Ready"],["open","All open"],["charge","To charge"],["completed","Completed"],["cancelled","Cancelled"],["all","All"]]
    .map(([s,l])=>`<button class="${s===tab?"on":""}" data-t="${s}">${l}<i>${cnt(s)}</i></button>`).join("");
  const L=filtered();
  $("list").innerHTML=L.length?L.map(ocard).join(""):`<div class="empty">No orders here${$("q").value?" for that search":""}.</div>`;
  renderPrep();renderDetail();
}
function ocard(o){
  const[pc,pt]=payInfo(o),items=o.items||[],kg=items.filter(i=>i.unit==="kg").reduce((a,i)=>a+ +i.qty,0);
  const fresh=o.status==="new"&&Date.now()-new Date(o.created_at)<36e5;
  return `<button class="oc ${sel===o.order_ref?"on":""} ${fresh?"fresh":""}" style="--sc:${SC[o.status]}" data-o="${esc(o.order_ref)}">
    <div class="r1"><span class="biz">${esc(biz(o))}</span><span class="amt">${M(dueTotal(o))}</span></div>
    <div class="r2"><span class="pill s" style="--sc:${SC[o.status]}">${LABEL[o.status]}</span><span class="pill ${pc}">${pt}</span>
      <span>${esc(storeName(o))}${o.preferred_date?" · "+day(o.preferred_date):""} · ${kg?(+kg.toFixed(1))+" kg · ":""}${ago(o.created_at)}</span></div></button>`;
}
function renderPrep(){
  const k=prepWhen==="today"?dayKey(0):prepWhen==="tomorrow"?dayKey(1):null;
  const prep={};ORD.filter(o=>["new","confirmed","ready"].includes(o.status)&&(!k||o.preferred_date===k)).forEach(o=>(o.items||[]).forEach(i=>{const key=i.name+"|"+i.unit;prep[key]=(prep[key]||0)+ +i.qty}));
  const pk=Object.entries(prep).sort((a,b)=>b[1]-a[1]);
  $("prep").innerHTML=pk.length?pk.map(([key,v])=>{const[n,u]=key.split("|");return`<div class="li"><span>${esc(n)}</span><b>${fq(+v.toFixed(2),u)}</b></div>`}).join(""):'<div class="li" style="color:rgba(255,255,255,.5)">Nothing to cut.</div>';
  window._prep=pk;
}
function renderDetail(){
  const o=ORD.find(x=>x.order_ref===sel);
  if(!o){$("detail").innerHTML=`<div class="detail"><div class="blank"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Select an order to see the address, items and payment.</div></div></div>`;return}
  const items=o.items||[],fin=o.final_items||null,d=draft[o.order_ref]||{};

  const[pc,pt]=payInfo(o);
  const rows=items.map((i,ix)=>{const f=fin&&fin[ix];const val=d[ix]!=null?d[ix]:f?+f.qty:"";const changed=val!==""&&+val!==+i.qty;
    const lt=(val!==""?+val:+i.qty)*+i.unit_price;
    return `<tr><td><b>${esc(i.name)}</b><div style="font-size:12.5px;color:var(--mut)">${M(i.unit_price)} / ${esc(i.unit)}</div></td>

      <td class="r"><input class="aw ${changed?"chg":""}" data-ix="${ix}" inputmode="decimal" placeholder="${+i.qty}" value="${val}" aria-label="Actual ${esc(i.name)}"></td>
      <td class="r q">${M(lt)}</td></tr>`}).join("");
  const est=items.reduce((a,i,ix)=>a+((d[ix]!=null&&d[ix]!==""?+d[ix]:fin&&fin[ix]?+fin[ix].qty:+i.qty)*+i.unit_price),0);
  const dirty=Object.keys(d).length>0;
  const isCard=o.payment_method==="card",ps=o.payment_status;
  const steps=FLOW.map((s,i)=>{const ci=FLOW.indexOf(o.status);return`<button style="--sc:${SC[s]}" class="${s===o.status?"cur":ci>i&&o.status!=="cancelled"?"done":""}" data-s="${s}">${LABEL[s]}</button>`}).join("");
  let pay=`<div class="paybox"><div class="lbl">Payment</div>
    <div class="row"><span>Method</span><span class="pill ${pc}">${pt}</span></div>
    <div class="row"><span>Ordered estimate</span><b>${M(o.total)}</b></div>
    ${o.final_total!=null?`<div class="row"><span>Final weighed</span><b>${M(o.final_total)}</b></div>`:""}
    ${isCard&&o.amount_authorised?`<div class="row"><span>Card hold</span><b>${M(o.amount_authorised)}</b></div>`:""}
    ${o.amount_captured?`<div class="row"><span>Charged</span><b>${M(o.amount_captured)}</b></div>`:""}<div class="acts">`;
  if(isCard&&ps==="authorised")pay+=`<button class="btn pri" data-pay="capture">Charge ${M(dueTotal(o))}</button><button class="btn red" data-pay="release">Release hold (no charge)</button><div class="hint">Save actual weights first. Holds expire 7 days after ordering.</div>`;
  else if(isCard&&(ps==="awaiting_card"||ps==="failed"))pay+=`<button class="btn soft" data-pay="refresh">Check card payment</button><div class="hint">The customer hasn't finished the card page. Call them or switch them to pay on collection.</div>`;
  else if(!isCard&&ps!=="paid_in_store")pay+=`<button class="btn pri" data-pay="mark">Mark as paid (${M(dueTotal(o))})</button>`;
  pay+=`</div></div>`;
  const wa=s=>`https://wa.me/${ph}?text=${encodeURIComponent(s)}`;
  const readyMsg=`Hi ${o.customer_name}, your Grabbi Butchery order ${o.order_ref} is ready${o.fulfilment==="delivery"?" and out for delivery soon":" to collect from "+storeName(o)}. Total ${M(dueTotal(o))}. Thank you!`;
  const confMsg=`Hi ${o.customer_name}, Grabbi Butchery here. Your order ${o.order_ref} is confirmed for ${day(o.preferred_date)||"your chosen day"}. We'll message when it's ready.`;
  $("detail").innerHTML=`<article class="detail" style="--sc:${SC[o.status]}">
    <div class="d-h"><div class="t"><h2>${esc(biz(o))}</h2><div class="sub">${o.business_type?esc(o.business_type)+" · ":""}Ordered ${new Date(o.created_at).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})} (${ago(o.created_at)})</div></div><span class="ref">${esc(o.order_ref)}</span></div>
    <div class="d-b">
      <div class="d-main">
        <div class="lbl">Status</div><div class="steps">${steps}</div>
        <div class="lbl">Items — enter actual weights after cutting</div>
        <table><thead><tr><th>Cut</th><th class="r">Ordered</th><th class="r">Actual</th><th class="r">Line</th></tr></thead><tbody>${rows}</tbody>
          <tfoot><tr><td colspan="2">${o.final_total!=null&&!dirty?"Final total":"Total"}</td><td></td><td class="r big">${M(est)}</td></tr></tfoot></table>
        <div class="wnote">${dirty?"Unsaved weights.":o.final_total!=null?"Actual weights saved.":"Leave blank if the weight matches the order."}</div>
        <div style="display:flex;gap:8px;margin-top:10px"><button class="btn dark" data-saveW ${dirty?"":"disabled"}>Save actual weights</button>${dirty?`<button class="btn soft" data-undoW>Undo</button>`:""}</div>
        ${o.notes?`<div class="notes"><b>Notes for the butcher</b>${esc(o.notes)}</div>`:""}
      </div>
      <div class="d-side">
        ${pay}

/* ---------- Actions ---------- */
async function setStatus(ref,ns){
  const o=ORD.find(x=>x.order_ref===ref);
  if(ns==="cancelled"&&!confirm(`Cancel ${ref}?`+(o.payment_status==="authorised"?" The card hold will be released.":"")))return;
  try{
    if(ns==="cancelled"&&o.payment_status==="authorised"){await api("release",ref)}
    const j=await rpc("admin_meat_order_status",{pass:PASS,ref,new_status:ns});replace(j.order);toast(`${ref} → ${LABEL[ns]}`)
  }catch(x){toast(x.message)}
}
function replace(o){const i=ORD.findIndex(x=>x.order_ref===o.order_ref);if(i>=0)ORD[i]=o;render()}
async function saveWeights(){
  const o=ORD.find(x=>x.order_ref===sel),d=draft[sel]||{};
  const fin=(o.items||[]).map((i,ix)=>({id:i.id,name:i.name,unit:i.unit,unit_price:+i.unit_price,qty:d[ix]!=null&&d[ix]!==""?+d[ix]:o.final_items&&o.final_items[ix]?+o.final_items[ix].qty:+i.qty}));
  if(fin.some(f=>isNaN(f.qty)||f.qty<0))return toast("Check the weights — numbers only");
  try{const j=await rpc("admin_meat_finalise",{pass:PASS,ref:sel,final_items:fin,note:null});delete draft[sel];replace(j.order);toast("Actual weights saved — final "+M(j.order.final_total))}catch(x){toast(x.message)}
}
async function payAction(a){
  const o=ORD.find(x=>x.order_ref===sel);
  if(draft[sel]&&Object.keys(draft[sel]).length)return toast("Save the actual weights first");
  try{
    if(a==="mark"){if(!confirm(`Mark ${o.order_ref} as paid ${M(dueTotal(o))}?`))return;const j=await rpc("admin_meat_mark_paid",{pass:PASS,ref:sel});replace(j.order);toast("Marked as paid");return}
    if(a==="capture"&&!confirm(`Charge ${M(Math.min(dueTotal(o),+o.amount_authorised))} to the customer's card?`))return;
    if(a==="release"&&!confirm("Release the card hold? The customer won't be charged."))return;
    const j=await api(a,sel);if(j.order)replace(j.order);toast(j.message||"Payment updated");
  }catch(x){toast(x.message)}
}

  <h1 style="font-size:16px;margin-top:20px">By order</h1><table><thead><tr><th>Ref</th><th>Business</th><th>When / where</th><th>Items</th></tr></thead><tbody>${open.map(o=>`<tr><td>${esc(o.order_ref)}</td><td>${esc(biz(o))}</td><td>${day(o.preferred_date)} · ${esc(storeName(o))}</td><td>${(o.items||[]).map(i=>esc(i.name)+" "+fq(i.qty,i.unit)).join(", ")}</td></tr>`).join("")}</tbody></table></section>`);
}
function printTicket(o){printDoc("Butcher ticket "+o.order_ref,`<section class="slip" style="max-width:80mm"><div class="ref" style="display:inline-block">${esc(o.order_ref)}</div><h1>${esc(biz(o))}</h1><div class="sub">${day(o.preferred_date)} · ${esc(storeName(o))}</div><table><tbody>${(o.items||[]).map(i=>`<tr><td style="font-size:16px">${esc(i.name)}</td><td class="n" style="font-size:16px">${fq(i.qty,i.unit)}</td></tr>`).join("")}</tbody></table>${o.notes?`<div class="notes">${esc(o.notes)}</div>`:""}</section>`)}
function csv(){
  const rows=[["Ref","Ordered","Status","Business","Type","VAT","Contact","Phone","Email","Fulfilment","Store","Address","Postcode","Date needed","Payment","Payment status","Item","Qty","Actual","Unit","Unit price","Line","Estimate","Final","Charged","Notes"]];
  filtered().forEach(o=>(o.items||[]).forEach((i,ix)=>{const f=o.final_items&&o.final_items[ix];rows.push([o.order_ref,new Date(o.created_at).toLocaleString("en-GB"),o.status,o.business_name,o.business_type,o.vat_number,o.customer_name,o.phone,o.email,o.fulfilment,o.store,o.address,o.postcode,o.preferred_date,o.payment_method,o.payment_status,i.name,i.qty,f?f.qty:"",i.unit,i.unit_price,f?f.line_total:i.line_total,o.total,o.final_total,o.amount_captured,o.notes])}));
  const b=new Blob([rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`grabbi-butchery-${new Date().toISOString().slice(0,10)}.csv`;a.click();
}

/* ---------- Events ---------- */
function openDetail(ref){sel=ref;render();$("dcol").classList.add("on");if(matchMedia("(max-width:820px)").matches)$("dcol").scrollTop=0}
function closeDetail(){$("dcol").classList.remove("on")}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t]");if(t){tab=t.dataset.t;render();return}
  const k=e.target.closest(".kpi[data-tab]");if(k){tab=k.dataset.tab;render();return}
  const oc=e.target.closest(".oc");if(oc){openDetail(oc.dataset.o);return}
  const s=e.target.closest("[data-s]");if(s&&sel&&s.closest("#detail")){setStatus(sel,s.dataset.s);return}
  const p=e.target.closest("[data-pay]");if(p){payAction(p.dataset.pay);return}
  if(e.target.closest("[data-saveW]")){saveWeights();return}
  if(e.target.closest("[data-undoW]")){delete draft[sel];renderDetail();return}
  if(e.target.closest("[data-print]")){printSlips([ORD.find(o=>o.order_ref===sel)]);return}
  if(e.target.closest("[data-prepone]")){printTicket(ORD.find(o=>o.order_ref===sel));return}
  const w=e.target.closest("#prepWhen button");if(w){prepWhen=w.dataset.w;document.querySelectorAll("#prepWhen button").forEach(b=>b.classList.toggle("on",b===w));renderPrep()}
});
document.addEventListener("change",e=>{if(e.target.classList.contains("aw")){const ix=e.target.dataset.ix,v=e.target.value.trim();draft[sel]=draft[sel]||{};if(v==="")delete draft[sel][ix];else draft[sel][ix]=v.replace(",",".");if(!Object.keys(draft[sel]).length)delete draft[sel];renderDetail();const n=document.querySelector(`.aw[data-ix="${+ix+1}"]`);if(n)n.focus()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("aw")){e.preventDefault();e.target.blur()}if(e.key==="Escape")closeDetail()});
$("q").addEventListener("input",render);$("fStore").addEventListener("change",render);$("fDays").addEventListener("change",()=>load(true));
function openPass(){$("np1").value=$("np2").value="";$("perr").textContent="";$("pm").classList.remove("hide");$("np1").focus()}
async function changePass(){const a=$("np1").value,b=$("np2").value;if(a.length<8)return $("perr").textContent="At least 8 characters";if(a!==b)return $("perr").textContent="Passcodes don't match";
  try{await rpc("admin_meat_change_pass",{pass:PASS,new_pass:a});PASS=a;ss.del("grb_admin");ss.set("grb_admin",a,false);$("pm").classList.add("hide");toast("Passcode changed")}catch(x){$("perr").textContent=x.message}}
(async()=>{const p=ss.get("grb_admin");if(p){PASS=p;try{await fetchOrders();enter()}catch{ss.del("grb_admin")}}})();
</script>
